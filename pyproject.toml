[project]
name = "langchain-streamlit-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "email", email = "chris.schneider@tuebingen.mpg.de" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2==3.1.6",
    "langchain==1.4.7",
    "langchain-openrouter==0.2.9",
    "pandas==3.1.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.4",
    "streamlit==1.66.1",
]

[project.scripts]
langchain-streamlit-app = "langchain_streamlit_app:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
