[project]
name = "langchain-streamlit-app"
version = "0.1.0"
description = "Streamlit app that analyses job descriptions for interview prep: key skills, likely interview topics and a study plan."
readme = "README.md"
authors = [
    { name = "cschneider", email = "schneider.chris.j@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jinja2==3.1.6",
    "langchain==1.4.7",
    "langchain-openrouter==0.2.9",
    "pandas==3.1.0",
    "pydantic==2.12.5",
    "python-dotenv==1.2.4",
    "streamlit==1.66.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".claude", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
filterwarnings = [
    # langchain-core imports pydantic.v1 for compatibility; harmless on 3.14.
    "ignore:Core Pydantic V1 functionality:UserWarning",
]
